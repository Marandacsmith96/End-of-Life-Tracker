{% if g.current_animal and g.checkin_prompt and request.endpoint not in ('entries.checkin', 'entries.quick_checkin', 'dashboard.today') %}
<aside class="notice" aria-label="Optional check-in">
  <span><strong>No check-in recorded today</strong> for {{ g.current_animal.name }}.</span>
  <a class="button small" href="{{ url_for('entries.checkin', animal_id=g.current_animal.id) }}">Check in</a>
</aside>
{% endif %}
