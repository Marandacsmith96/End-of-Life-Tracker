# Fly.io. Deployed by .github/workflows/deploy-fly.yml, or by hand:
# `fly apps create pet-qol-tracker-9uwy`, `fly volumes create data --size 1`,
# `fly secrets set PET_QOL_PASSCODE=...`, `fly deploy`.
app = "pet-qol-tracker-9uwy"
primary_region = "iad"

[build]

[env]
  PET_QOL_DATA_DIR = "/data"
  PORT = "8000"

[[mounts]]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
